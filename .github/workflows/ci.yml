name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TechnoVIS.csproj

      - name: Build
        run: dotnet build TechnoVIS.csproj --no-restore --configuration Release

      # Pas encore de projet de tests - a activer des qu'un projet *.Tests existe
      # - name: Test
      #   run: dotnet test --no-build --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t technovis-api:ci .
