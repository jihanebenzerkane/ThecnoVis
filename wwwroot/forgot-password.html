<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechnoVIS — Mot de passe oublié</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-body">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <img src="logo.svg" alt="TechnoVIS Logo" class="auth-logo">
          <span class="auth-brand-name">TechnoVIS</span>
        </div>
        <h1 class="auth-title">Mot de passe oublié</h1>
        <p class="auth-subtitle">Saisissez votre adresse e-mail pour recevoir un lien sécurisé de réinitialisation.</p>
      </div>

      <div id="forgot-alert" class="auth-alert" style="display: none;"></div>

      <form id="form-forgot-password" class="auth-form">
        <div class="auth-field">
          <label for="forgot-email" class="auth-label">Adresse e-mail</label>
          <div class="auth-input-wrapper">
            <input type="email" id="forgot-email" class="auth-input" placeholder="nom@entreprise.com" required autocomplete="email" autofocus>
          </div>
        </div>

        <button type="submit" id="btn-submit-forgot" class="btn btn-primary auth-submit-btn">
          <span>Envoyer le lien de réinitialisation</span>
        </button>
      </form>

      <div class="auth-footer-nav">
        <a href="/" class="auth-back-link">Retour à la page de connexion</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("form-forgot-password");
    const emailInput = document.getElementById("forgot-email");
    const alertDiv = document.getElementById("forgot-alert");
    const submitBtn = document.getElementById("btn-submit-forgot");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      alertDiv.style.display = "none";
      alertDiv.className = "auth-alert";
      submitBtn.disabled = true;
      submitBtn.textContent = "Vérification en cours...";

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          alertDiv.className = "auth-alert auth-alert-success";
          alertDiv.textContent = data.message || "Si un compte correspond à cette adresse e-mail, un lien de réinitialisation vous a été envoyé.";
          alertDiv.style.display = "block";
          form.reset();
        } else {
          alertDiv.className = "auth-alert auth-alert-danger";
          alertDiv.textContent = data.message || "Impossible de traiter la demande.";
          alertDiv.style.display = "block";
        }
      } catch (err) {
        alertDiv.className = "auth-alert auth-alert-danger";
        alertDiv.textContent = "Erreur de communication avec le serveur.";
        alertDiv.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Envoyer le lien de réinitialisation";
      }
    });
  </script>
</body>
</html>
